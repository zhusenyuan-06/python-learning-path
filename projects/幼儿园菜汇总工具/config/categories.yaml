# 云湖湾幼儿园 · 菜品配送汇总 · 分类配置
# 改这个文件就能改归类规则，不需要动代码。
#
# ============ 想加一个新类别？就三步（全程不用碰代码）============
#   1. 在 categories 下面加一行类别名（位置 = 汇总表里的显示顺序）
#   2. 在 colors 下面给它一个颜色（不给就用默认灰）
#   3. 在 keyword_rules 里加一组关键词（注意放在比它更宽泛的规则前面）
#   4.（可选）如果是把老菜从旧类挪过来，再在 migrations 里写一条，跑一次自动改归类表
# ================================================================

version: 2

# 九个类别（顺序 = 汇总表里的显示顺序）
categories:
  - 蔬菜
  - 豆制品
  - 水产和肉类
  - 米面
  - 水果坚果
  - 蛋
  - 奶制品
  - 干货调味
  - 油

# 图表配色。加新类别时在这里给个颜色，不然就是默认灰色。
colors:
  蔬菜: "#6AA84F"
  豆制品: "#D9A036"
  水产和肉类: "#CC0000"
  米面: "#E69138"
  水果坚果: "#FFD966"
  蛋: "#C27BA0"
  奶制品: "#A2C4C9"
  干货调味: "#8E7CC3"
  油: "#666666"
  待定: "#BFBFBF"

# sheet 名 -> 供应商名。sheet 名写得乱时在这里纠正。
# key 可以写完整的 sheet 名（推荐，只影响这一张表），也可以写去掉月份后的名字。
supplier_aliases:
  "幼儿 9月": 锦源     # 9 月那张表 sheet 名写的是人群，实际是锦源送的

# 老板裁决：这几样不按常识归类，按这里写的来。优先级最高。
# 想改归类，直接改这里。
overrides:
  - {match: 纸碟,   category: 干货调味, note: 老板裁决：一次性用品计入干货}
  - {match: 海苔,   category: 干货调味, note: 老板裁决}
  - {match: 酸奶,   category: 奶制品,   note: 老板裁决}
  - {match: 蛋挞皮, category: 蛋,       note: 老板裁决}
  - {match: 薯条,   category: 水果坚果, note: 老板裁决}
  - {match: 小米椒, category: 蔬菜,     note: 避免"小米"被误判成米面}
  - {match: 奶粉,   category: 奶制品,   note: 避免被"粉"误判成米面}
  - {match: 云吞皮, category: 米面,     note: 面皮类}
  - {match: 红薯干, category: 水果坚果, note: 果干类}
  - {match: 番薯干, category: 水果坚果, note: 果干类}
  - {match: 水果干, category: 水果坚果, note: 果干类}
  - {match: 紫薯粉, category: 干货调味, note: 粉料类}
  - {match: 炸粉,   category: 干货调味, note: 粉料类}
  - {match: 红枣,   category: 干货调味, note: 干果/煲汤料}
  - {match: 蜜枣,   category: 干货调味, note: 干果/煲汤料}
  - {match: 羊肚菌, category: 蔬菜,     note: 菌菇，避免"羊"被判成肉}
  - {match: 鸡精,   category: 干货调味, note: 调味料，避免"鸡"被判成肉}
  - {match: 鸡粉,   category: 干货调味, note: 调味料，避免"鸡"被判成肉}
  - {match: 猪油,   category: 油,       note: 油脂类}
  - {match: 冻虾仁, category: 水产和肉类, note: 海鲜}
  - {match: 虾仁,   category: 水产和肉类, note: 海鲜}
  - {match: 洗洁精, category: 干货调味, note: 老板裁决：非食材用品计入干货}
  - {match: 手套,   category: 干货调味, note: 老板裁决：非食材用品计入干货}
  - {match: 保鲜膜, category: 干货调味, note: 老板裁决：非食材用品计入干货}
  - {match: 保鲜袋, category: 干货调味, note: 老板裁决：非食材用品计入干货}
  - {match: 食品夹, category: 干货调味, note: 老板裁决：非食材用品计入干货}
  - {match: 毛巾,   category: 干货调味, note: 老板裁决：非食材用品计入干货}
  - {match: 花生米, category: 干货调味, note: 炒货类}
  - {match: 花生,   category: 干货调味, note: 炒货类}
  - {match: 脆皮筒, category: 米面,     note: 面制品}
  - {match: 丝苗米, category: 米面,     note: 大米类}
  - {match: 黄金糕, category: 水果坚果, note: 糕点类（幼儿园把糕点归这一类）}
  - {match: 阳光玫瑰, category: 水果坚果, note: 葡萄品种}
  - {match: 无籽提, category: 水果坚果, note: 提子类}
  - {match: 红提,   category: 水果坚果, note: 提子类}
  - {match: 抹布,   category: 干货调味, note: 老板裁决：非食材用品计入干货}
  # ---------- 豆制品（第 9 类，2026-10 新增）----------
  # 注意：这里全是精确词，绝不能只写"豆"，
  # 否则土豆/荷兰豆/毛豆/绿豆芽/红豆 全会被拐进来。
  - {match: 豆腐,   category: 豆制品,   note: 第9类}
  - {match: 腐竹,   category: 豆制品,   note: 第9类}
  - {match: 千张,   category: 豆制品,   note: 第9类}
  - {match: 豆腐皮, category: 豆制品,   note: 第9类}
  - {match: 豆浆,   category: 豆制品,   note: 第9类}
  - {match: 豆干,   category: 豆制品,   note: 第9类}
  - {match: 黄豆,   category: 豆制品,   note: 第9类}
  - {match: 红豆,   category: 豆制品,   note: 第9类（2026-10 老板改：杂粮豆也算豆制品）}
  - {match: 绿豆,   category: 豆制品,   note: 第9类（同上；绿豆芽在前面已被钉成蔬菜）}
  # ---------- 含"豆"但不是豆制品的，钉死 ----------
  - {match: 土豆,   category: 蔬菜,     note: 是菜不是豆}
  - {match: 荷兰豆, category: 蔬菜,     note: 是菜不是豆}
  - {match: 毛豆,   category: 蔬菜,     note: 是菜不是豆}
  - {match: 豆芽,   category: 蔬菜,     note: 是菜不是豆}
  - {match: 绿豆芽, category: 蔬菜,     note: 是菜不是豆}
  - {match: 豆角,   category: 蔬菜,     note: 是菜不是豆}
  - {match: 四季豆, category: 蔬菜,     note: 是菜不是豆}
  - {match: 豌豆,   category: 蔬菜,     note: 是菜不是豆}

# 一次性迁移：把归类表（mapping.xlsx）里**已经确认过**的行，从旧类挪到新类。
# 跑一次就会改写 mapping.xlsx，改完这段留着也无害（可以删）。
# 注意执行顺序：豆制品先跑，蔬菜后跑。
# 这样"绿豆芽"即使被"绿豆"误伤一次，也会被后面的规则拉回蔬菜。
migrations:
  - to: 豆制品
    match: [豆腐, 腐竹, 千张, 豆腐皮, 豆浆, 豆干, 黄豆, 红豆, 绿豆]
  - to: 蔬菜
    match: [土豆, 荷兰豆, 毛豆, 豆芽, 豆角, 四季豆, 豌豆]

# 关键词初判规则：从上往下匹配，命中即停。
# 顺序很重要 —— 越具体的越靠前，越宽泛的越靠后。
keyword_rules:
  - category: 奶制品
    keywords: [奶, 酸奶, 奶酪, 芝士, 黄油, 炼乳]

  - category: 蛋
    keywords: [蛋]

  - category: 油
    keywords: [玉米油, 花生油, 调和油, 菜籽油, 大豆油, 葵花籽油, 橄榄油, 香油, 食用油]

  - category: 水果坚果
    keywords: [开心果, 腰果, 核桃, 杏仁, 板栗, 瓜子, 松子, 松仁, 榛子, 夏威夷果,
               碧根果, 巴旦木, 葡萄干, 蔓越莓, 话梅, 橄榄, 果干,
               哈密瓜, 西瓜, 苹果, 香蕉, 橙, 桔, 橘, 梨, 桃, 李,
               葡萄, 芒果, 菠萝, 草莓, 樱桃, 火龙果, 奇异果, 猕猴桃, 柚子,
               柠檬, 荔枝, 龙眼, 榴莲, 柿子, 石榴, 蓝莓, 圣女果, 番石榴,
               百香果, 无花果, 千禧果, 提子, 红提, 青提, 玫瑰, 红枣]

  # 豆制品必须排在蔬菜前面，否则"豆"字会被蔬菜规则抢走
  - category: 豆制品
    keywords: [豆腐, 腐竹, 千张, 豆腐皮, 豆浆, 豆干, 黄豆]

  - category: 水产和肉类
    keywords: [肉, 鸡, 鸭, 鹅, 牛, 羊, 猪, 鱼, 虾, 蟹, 贝, 鱿, 蚌, 蛤, 蚝, 海参,
               腊, 肠, 骨, 蹄, 肝, 肚, 翅, 腿, 五花, 排骨, 里脊, 肉卷, 肉丸,
               肉松, 干蒸, 烧卖, 云吞, 饺子, 包子, 馒头, 鲜牛]

  - category: 米面
    keywords: [面, 面粉, 挂面, 意粉, 意大利面, 面条, 米粉, 河粉, 粉丝, 面包,
               汤圆, 手抓饼, 通心粉, 糯米, 大米, 糙米, 黑米, 紫米, 红米,
               杂粮米, 薏米, 藜麦, 米线, 燕麦, 意面, 小米, 丝苗米, 油粘米]

  - category: 干货调味
    keywords: [干香菇, 干冬菇, 干百合, 干虫草花, 干酵母, 干海带, 干芡实, 干山楂,
               干辣椒, 干贝, 虾米, 瑶柱, 木耳, 银耳, 紫菜, 海苔, 枸杞, 莲子,
               桂圆, 玉竹, 茅根, 陈皮, 海底椰, 八角, 桂皮, 花椒, 胡椒, 孜然,
               淀粉, 生粉, 味精, 鸡精, 蚝油, 生抽, 老抽, 料酒, 酱油, 醋, 盐,
               糖, 白糖, 冰糖, 红糖, 沙司, 番茄酱, 沙拉酱, 叉烧酱, 芝麻糊,
               黑芝麻, 芝麻, 豆豉, 卤料, 卤水, 五香, 干]

  - category: 蔬菜
    keywords: [菜, 瓜, 豆, 菇, 荪, 姜, 葱, 蒜, 椒, 薯, 芋, 藕, 笋, 芹, 青,
               萝卜, 土豆, 马铃薯, 山药, 淮山, 葛, 玉米, 蔗,
               茄子, 西红柿, 番茄, 黄瓜, 冬瓜, 南瓜, 苦瓜, 丝瓜, 白菜, 青菜,
               生菜, 菠菜, 油麦, 茼蒿, 空心菜, 苋菜, 芥菜, 包菜, 椰菜, 花菜,
               西兰花, 豆角, 四季豆, 荷兰豆, 豌豆, 毛豆, 豆芽, 韭菜, 香菜,
               洋葱, 红葱, 蒜苗, 莴笋, 叶, 佛手瓜]

# 匹配不到任何规则时的兜底类别（汇总时仍会列入"待补充"清单提醒你）
fallback_category: 待定
